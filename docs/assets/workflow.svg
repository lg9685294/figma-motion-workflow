<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">从参考材料到动效验收的工作流</title>
<desc id="desc">确认材料与能力，锁定几何与需求，建立事件依赖，按能力实现，实际播放与逐帧验收。各阶段输出可追踪证据；未知项保留待核验。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#8c959f" stroke-width="1.2"/></marker></defs>
<rect width="1120" height="420" rx="12" fill="#f6f8fa"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<text x="40" y="49" font-size="22" font-weight="600" fill="#1f2328">把动效需求变成可追踪的制作与验收</text>
<text x="40" y="78" font-size="14" fill="#59636e">每一步都有明确产物；没有源数据的项目保留待核验。</text>
<rect x="40" y="115" width="198" height="138" rx="7" fill="white" stroke="#d1d9e0"/><text x="55" y="144" font-size="13" font-weight="600" fill="#0969da">01</text><text x="55" y="173" font-size="17" font-weight="600" fill="#1f2328">收拢材料与能力</text><text x="55" y="199" font-size="12" fill="#59636e">源文件 / 版本 / 可读写范围</text><text x="55" y="230" font-size="13" fill="#1f2328">产物：来源索引</text><path d="M239 184 H249" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="250" y="115" width="198" height="138" rx="7" fill="white" stroke="#d1d9e0"/><text x="265" y="144" font-size="13" font-weight="600" fill="#0969da">02</text><text x="265" y="173" font-size="17" font-weight="600" fill="#1f2328">锁定几何与需求</text><text x="265" y="199" font-size="12" fill="#59636e">形状 / 起点 / 有效修改</text><text x="265" y="230" font-size="13" fill="#1f2328">产物：生效规格</text><path d="M449 184 H459" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="460" y="115" width="198" height="138" rx="7" fill="white" stroke="#d1d9e0"/><text x="475" y="144" font-size="13" font-weight="600" fill="#0969da">03</text><text x="475" y="173" font-size="17" font-weight="600" fill="#1f2328">建立事件依赖</text><text x="475" y="199" font-size="12" fill="#59636e">属性阈值 / 曲线 / 总时长</text><text x="475" y="230" font-size="13" fill="#1f2328">产物：时间审计</text><path d="M659 184 H669" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="670" y="115" width="198" height="138" rx="7" fill="white" stroke="#d1d9e0"/><text x="685" y="144" font-size="13" font-weight="600" fill="#0969da">04</text><text x="685" y="173" font-size="17" font-weight="600" fill="#1f2328">按可用能力实现</text><text x="685" y="199" font-size="12" fill="#59636e">分层 / 原型 / 制作提示词</text><text x="685" y="230" font-size="13" fill="#1f2328">产物：可交接实现</text><path d="M869 184 H879" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="880" y="115" width="198" height="138" rx="7" fill="white" stroke="#d1d9e0"/><text x="895" y="144" font-size="13" font-weight="600" fill="#0969da">05</text><text x="895" y="173" font-size="17" font-weight="600" fill="#1f2328">播放与逐帧验收</text><text x="895" y="199" font-size="12" fill="#59636e">首帧 / 阈值 / 末帧 / 重放</text><text x="895" y="230" font-size="13" fill="#1f2328">产物：验收记录</text>
<path d="M986 253 V302 H142 V262" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="411" y="288" width="300" height="27" rx="13" fill="#f6f8fa"/>
<text x="561" y="307" text-anchor="middle" font-size="13" fill="#59636e">发现差异 → 只修相关属性与下游依赖</text>
<path d="M40 341 H1080" stroke="#d1d9e0"/>
<text x="40" y="373" font-size="13" fill="#59636e">原创工作流图示 · 不含客户素材、私有节点或项目参数</text>
<text x="40" y="397" font-size="12" fill="#59636e">代码预览与 Figma 源时间轴、实际播放、交互重放分别验收。</text>
</g></svg>