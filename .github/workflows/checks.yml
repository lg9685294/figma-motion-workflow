name: Check skill and timing
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run timing tests
        run: python -m unittest discover -s skills/figma-motion-workflow/scripts -p 'test_*.py' -v
      - name: Check repository and download bundle
        run: python scripts/check_repository.py
